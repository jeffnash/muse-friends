[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-friends"
version = "0.1.0"
description = "Trust and policy layer for Muse-to-Muse work over Muse Mail"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42,<51",
    "httpx>=0.27,<1",
    "starlette>=0.41,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
muse-friendsd = "musefriends.app:main"
muse-friends = "musefriends.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
